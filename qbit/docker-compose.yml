services:
  qbittorrentee:
    image: superng6/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /root/qbittorrent/config:/config
      - /root/download/bangumi:/downloads
    ports:
      - 8001:6881
      - 8001:6881/udp
      - 8080:8080
